name: test

# Install the formula from this tap the way users do and run its test.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: brew install / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest]
    steps:
      - name: Put brew on PATH (Linux runners ship it outside PATH)
        if: runner.os == 'Linux'
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - name: Install from the tap and run the formula test
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install nxtsoft/cgraph/cgraph
          brew test nxtsoft/cgraph/cgraph
          cgraph --version
